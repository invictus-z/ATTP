# 谛听演示后端编排：协议节点 + 工具节点 + 智能体节点
# 启动顺序：protocol & tool 并行启动 → 均 healthy 后 agent 启动（agent 需先发现工具）。
# 用户节点（Electron）跑在宿主，经发布的端口访问：9000(protocol) / 8001(agent webApp) / 9999(tool)。
#
# 用法：
#   1. 复制 .env.example 为 .env 并填入 LLM_API_KEY / LLM_BASE_URL / LLM_MODEL
#   2. docker compose up -d --build
# 离线：从 GitHub Release 下载 attp-images.tar.gz，docker load 后去掉 --build。

services:
  protocol:
    build:
      context: .
      dockerfile: docker/Dockerfile.protocol
    image: attp-protocol:latest
    container_name: attp-protocol
    ports:
      - "9000:9000"
    environment:
      # 意图追踪分析层 LLM（protocol-entrypoint.sh 用 envsubst 渲染进 analysis 配置）
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
    restart: unless-stopped

  tool:
    build:
      context: .
      dockerfile: docker/Dockerfile.tool
    image: attp-tool:latest
    container_name: attp-tool
    ports:
      - "9999:9999"
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    image: attp-agent:latest
    container_name: attp-agent
    depends_on:
      protocol:
        condition: service_healthy
      tool:
        condition: service_healthy   # tool 必须先 healthy，agent 才能发现工具
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
    ports:
      - "8000:8000"   # agent attpServer（agent 间 ad 发现）
      - "8001:8001"   # agent webApp（用户节点 WS 入口）
    restart: unless-stopped
