<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nanobot Agent Workspace</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Lucide 图标 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/src/style.css">
    
    <script>
        // 定制柔和的现代化主题色
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // 模仿截图中的那抹柔和的红色/粉色选中态
                        brand: { 50: '#fef2f2', 100: '#fee2e2', 500: '#ef4444', 600: '#dc2626' },
                        // 主背景和边框色
                        surface: '#FAFAFA',
                        borderLight: '#F3F4F6'
                    },
                    fontFamily: {
                        sans:['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
                        mono:['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface text-gray-800 h-screen flex overflow-hidden font-sans antialiased selection:bg-brand-100 selection:text-brand-600" onclick="closeAllDropdowns(event)">
    <div id="app" class="flex w-full h-full"></div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
